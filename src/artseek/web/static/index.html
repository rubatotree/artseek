<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArtSeek · 本地插画检索</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfafc;
      --panel: rgba(255, 255, 255, .86);
      --ink: #302d38;
      --muted: #777180;
      --line: #e9e4ec;
      --rose: #d97f9e;
      --rose-soft: #f9e6ed;
      --blue: #7799bd;
      --blue-soft: #eaf2fa;
      --shadow: 0 16px 45px rgba(69, 51, 76, .09);
      --page-gutter: 20px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: rgba(201, 122, 152, .18);
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, #f9e9f0 0, transparent 31rem),
        radial-gradient(circle at 95% 10%, #e8f2fb 0, transparent 34rem),
        var(--paper);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .shell { width: min(1500px, 100%); margin: 0 auto; padding-inline: var(--page-gutter); }
    header { padding: 42px 0 23px; display: flex; align-items: end; gap: 22px; }
    .brand { font: 700 clamp(27px, 4vw, 42px)/1.05 Georgia, serif; letter-spacing: -.03em; }
    .subtitle { color: var(--muted); padding-bottom: 4px; }
    .search-layout {
      display: grid;
      grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .search-column, .results-column { min-width: 0; }
    .fold-toggle { display: none; }
    .tree-panel {
      position: sticky; top: 12px; z-index: 9;
      max-height: calc(100dvh - 24px);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 14px 12px 16px;
      border: 1px solid rgba(255,255,255,.9); border-radius: 22px;
      background: var(--panel); backdrop-filter: blur(18px); box-shadow: var(--shadow);
    }
    .tree-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .tree-title { font-size: 14px; font-weight: 700; }
    .tree-sort {
      min-width: 0; width: 100%; max-width: 168px;
      border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
      color: var(--ink); background: #fff; font: 12px/1.2 inherit;
    }
    .tree-sort:focus-visible, .tree-row input:focus-visible, .tree-twist:focus-visible,
    .tree-name:focus-visible, .time-preset:focus-visible, .time-custom input:focus-visible {
      outline: 2px solid #ddb2c2; outline-offset: 2px;
    }
    .tree-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .tree-actions button { padding: 7px 10px; font-size: 12px; }
    .tree-summary { margin-bottom: 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .tree-empty { padding: 18px 8px; color: var(--muted); font-size: 13px; }
    .tree-row {
      display: flex; align-items: center; gap: 2px;
      min-height: 32px; margin: 1px 0; padding-right: 4px; border-radius: 8px;
    }
    .tree-row:hover { background: #f6f1f5; }
    .tree-row.is-preview { background: var(--rose-soft); }
    .tree-row.is-preview:hover { background: #f3d7e2; }
    .tree-twist {
      flex: 0 0 auto; width: 22px; height: 22px; padding: 0;
      border-radius: 6px; background: transparent; color: var(--muted); font-size: 10px;
    }
    .tree-twist:hover { transform: none; background: #efeaf0; }
    .tree-twist[hidden] { visibility: hidden; pointer-events: none; }
    .tree-check {
      display: flex; align-items: center; flex: 0 0 auto;
      padding: 4px 2px; cursor: pointer;
    }
    .tree-check input { accent-color: #c97a98; width: 15px; height: 15px; }
    .tree-name {
      min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      padding: 4px 6px 4px 4px; border-radius: 6px;
      background: transparent; color: inherit;
      font: inherit; font-size: 13px; font-weight: 500; text-align: left;
    }
    .tree-name:hover { transform: none; background: rgba(48, 45, 56, .06); }
    .tree-row.is-preview .tree-name { color: #8a5268; }
    .tree-new {
      flex: 0 0 auto; padding: 1px 6px; border-radius: 999px;
      background: var(--rose-soft); color: #8a5268; font-size: 10px; font-weight: 650;
    }
    .tree-count {
      margin-left: auto; flex: 0 0 auto; padding: 4px 2px;
      color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .tree-remove {
      flex: 0 0 auto; width: 22px; height: 22px; padding: 0;
      border-radius: 6px; background: transparent; color: #b08996; font-size: 14px; line-height: 1;
    }
    .tree-remove:hover { transform: none; background: #f3e4ea; color: #8a5268; }
    .tree-refresh {
      flex: 0 0 auto; width: 22px; height: 22px; padding: 0;
      border-radius: 6px; background: transparent; color: #7a8aa0; font-size: 13px; line-height: 1;
    }
    .tree-refresh:hover { transform: none; background: #eaf2fa; color: #56718d; }
    .index-add { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 10px; }
    .index-add input {
      min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px;
      color: var(--ink); background: #fff; font: 12px/1.2 inherit;
    }
    .index-add button { padding: 7px 10px; font-size: 12px; }
    .index-status { margin-bottom: 10px; color: #8a5268; font-size: 12px; line-height: 1.45; }
    .side-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .side-tab {
      padding: 8px 10px; border-radius: 10px; background: #f6f1f5; color: #665866; font-size: 13px;
    }
    .side-tab:hover { transform: none; }
    .side-tab.is-active { background: var(--rose-soft); color: #8a5268; }
    .advanced-options { display: grid; gap: 14px; color: var(--muted); font-size: 13px; }
    .advanced-options label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .advanced-options input[type="range"] { flex: 1; min-width: 80px; }
    .model-block {
      display: grid; gap: 8px; padding-top: 4px;
      border-top: 1px solid var(--line);
    }
    .model-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .model-state { color: #8a5268; font-size: 12px; font-weight: 650; }
    .model-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .advanced-options input[type="number"] {
      width: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
      color: var(--ink); background: #fff; font: inherit; font-size: 13px;
    }
    #tab-scope[hidden], #tab-advanced[hidden] { display: none; }
    .time-filter { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .time-filter-label { margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .time-preset {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px;
      color: var(--ink); background: #fff; font: 12px/1.2 inherit;
    }
    .time-custom { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .time-custom.visible { display: grid; }
    .time-custom label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; }
    .time-custom input[type="date"] {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px;
      color: var(--ink); background: #fff; font: inherit; font-size: 12px;
    }
    .search-panel {
      position: sticky; top: 12px; z-index: 10;
      padding: 16px; border: 1px solid rgba(255,255,255,.9); border-radius: 22px;
      background: var(--panel); backdrop-filter: blur(18px); box-shadow: var(--shadow);
      transition: box-shadow .15s ease, outline-color .15s ease, background .15s ease;
    }
    body.file-drag .search-panel {
      background: #fff8fb;
      outline: 2px dashed #d7a3b6;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px rgba(217, 127, 158, .08);
    }
    .search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .search-actions { display: flex; gap: 8px; }
    .composer { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-top: 10px; }
    .text-weight-card, .ref-add {
      width: 72px; height: 72px; padding: 0; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-size: 11px; font-weight: 650;
    }
    .text-weight-card { background: var(--rose-soft); color: #8a5268; }
    .text-weight-card input {
      width: 52px; height: 26px; border: 0; border-radius: 8px; padding: 0;
      text-align: center; background: rgba(255,255,255,.7); color: inherit;
      font: 700 15px/26px inherit; font-variant-numeric: tabular-nums;
      appearance: textfield; -moz-appearance: textfield;
    }
    .text-weight-card input::-webkit-outer-spin-button,
    .text-weight-card input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .ref-strip { display: flex; flex-wrap: wrap; gap: 8px; }
    .ref-card, .ref-add {
      position: relative; flex: 0 0 auto;
      outline: 1px solid transparent; outline-offset: 1px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, outline-color .15s ease, color .15s ease;
    }
    .ref-card {
      width: 72px; height: 72px; padding: 0; border-radius: 12px;
      overflow: hidden; cursor: zoom-in; background: #efeaf0;
    }
    .ref-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .18s ease;
    }
    .ref-card .ref-weight {
      position: absolute; left: 4px; bottom: 4px; padding: 1px 5px; border-radius: 999px;
      background: rgba(31,27,35,.72); color: #fff; font-size: 10px; font-variant-numeric: tabular-nums;
    }
    .ref-card .ref-remove {
      position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0;
      border-radius: 999px; background: rgba(31,27,35,.62); color: #fff; font-size: 13px; line-height: 1;
    }
    .ref-card .ref-remove:hover { transform: none; background: rgba(31,27,35,.84); }
    .ref-add {
      cursor: pointer; background: #f6f1f5; color: #665866;
      border: 1px dashed #d7c8d0;
    }
    .ref-add span:first-child { font-size: 20px; line-height: 1; }
    @media (hover: hover) and (pointer: fine) {
      .ref-add:hover {
        transform: translateY(-2px);
        background: var(--rose-soft); color: #8a5268; border-color: #d7a3b6;
        box-shadow: 0 8px 18px rgba(69, 51, 76, .1);
      }
      .ref-card:hover {
        transform: translateY(-2px);
        outline-color: #ddb2c2;
        box-shadow: 0 8px 18px rgba(69, 51, 76, .12);
      }
      .ref-card:hover img { transform: scale(1.06); }
      .ref-card .ref-remove { opacity: 0; }
      .ref-card:hover .ref-remove,
      .ref-card.is-selected .ref-remove,
      .ref-card:focus-visible .ref-remove { opacity: 1; }
    }
    .ref-add:active, .ref-card:active { transform: scale(.96); }
    .ref-card.is-selected {
      outline: 2px solid #c97a98; outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--rose-soft);
    }
    .ref-add:focus-visible, .ref-card:focus-visible {
      outline: 2px solid #ddb2c2; outline-offset: 2px;
    }
    body.file-drag .ref-add {
      background: #fff8fb; color: #8a5268; border-color: #d7a3b6;
      box-shadow: 0 0 0 4px rgba(217, 127, 158, .12);
    }
    input[type="text"] {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px;
      color: var(--ink); background: #fff; font: inherit; outline: none;
    }
    input[type="text"]:focus { border-color: #ddb2c2; box-shadow: 0 0 0 4px var(--rose-soft); }
    button, .upload-label {
      border: 0; border-radius: 14px; padding: 12px 17px; cursor: pointer; font: 650 14px/1 inherit;
      touch-action: manipulation;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      button:hover, .upload-label:hover { transform: translateY(-1px); }
    }
    .primary { color: white; background: linear-gradient(135deg, #cc7897, #b8759d); box-shadow: 0 8px 20px #e5bfd0; }
    .secondary, .upload-label { color: #665866; background: #f6f1f5; }
    .random-browse { white-space: nowrap; }
    button:focus-visible { outline: 2px solid #ddb2c2; outline-offset: 2px; }
    input[type="file"] { display: none; }
    .viewer-weight { display: flex; align-items: center; gap: 6px; color: #ddd6e0; font-size: 13px; }
    .viewer-weight[hidden] { display: none; }
    .viewer-weight input {
      width: 64px; border: 1px solid #3d3742; border-radius: 8px; padding: 6px 7px;
      background: #241f28; color: #eee8f0; font: inherit;
    }
    .query-info { min-height: 24px; margin: 18px 2px 8px; color: var(--muted); font-size: 13px; }
    .chip { display: inline-block; margin: 3px 5px 3px 0; padding: 5px 9px; border-radius: 999px; background: var(--rose-soft); color: #8a5268; }
    .chip.negative { background: #eeeef2; color: #706d77; text-decoration: line-through; }
    .gallery {
      display: flex; align-items: flex-start; gap: 14px; padding: 8px 0 60px;
    }
    .gallery-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .card {
      overflow: hidden; border: 1px solid #eee9ef;
      border-radius: 16px; background: #fff; box-shadow: 0 7px 22px rgba(58, 47, 64, .055);
    }
    .image-wrap { position: relative; background: #f1edf2; cursor: zoom-in; overflow: hidden; }
    .image-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .score { position: absolute; top: 9px; right: 9px; padding: 5px 8px; border-radius: 999px; background: rgba(31,27,35,.72); color: #fff; font-size: 12px; backdrop-filter: blur(8px); }
    .card-body { padding: 10px 11px 11px; }
    .filename { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 650; }
    .meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .hits { margin-top: 7px; font-size: 11px; color: #965a71; line-height: 1.5; }
    .card-actions { display: flex; gap: 7px; margin-top: 8px; }
    .card-actions button { padding: 7px 9px; border-radius: 9px; font-size: 11px; background: #f7f4f7; color: #68616b; }
    .empty { padding: 90px 20px; text-align: center; color: var(--muted); }
    .load-more {
      padding: 18px 12px 48px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .loading { opacity: .55; pointer-events: none; }
    dialog {
      position: fixed; inset: 0;
      width: 100%; height: 100%; max-width: none; max-height: none;
      margin: 0; padding: 0; border: 0; overflow: hidden;
      background: rgba(16, 13, 18, .42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    dialog[open] { display: flex; flex-direction: column; }
    dialog::backdrop { background: rgba(16, 13, 18, .22); }
    .viewer-stage {
      position: relative; flex: 1; min-width: 0; min-height: 0;
      display: grid; place-items: center;
      overflow: hidden; touch-action: none; overscroll-behavior: none;
      cursor: zoom-in; user-select: none; background: transparent;
    }
    .viewer-stage.is-zoomed { cursor: grab; }
    .viewer-stage.is-dragging { cursor: grabbing; }
    .viewer-stage img {
      position: absolute; left: 50%; top: 50%;
      display: block; width: auto; height: auto;
      max-width: none; max-height: none;
      transform-origin: 0 0;
      will-change: transform; -webkit-user-drag: none;
    }
    .viewer-stage img[data-slot="prev"],
    .viewer-stage img[data-slot="next"] {
      pointer-events: none;
      z-index: 0;
    }
    .viewer-stage img[data-slot="current"] { z-index: 1; }
    .viewer-nav {
      position: absolute; top: 50%; z-index: 2;
      width: 46px; height: 72px; padding: 0;
      border-radius: 14px; background: rgba(48, 43, 52, .72); color: #eee8f0;
      font-size: 28px; line-height: 1;
      transform: translateY(-50%);
    }
    .viewer-nav:hover { transform: translateY(-50%); background: rgba(48, 43, 52, .94); }
    .viewer-nav.prev { left: 12px; }
    .viewer-nav.next { right: 12px; }
    .viewer-nav[hidden] { display: none; }
    .viewer-close {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 40px; height: 40px; padding: 0;
      border-radius: 12px; background: rgba(48, 43, 52, .72); color: #eee8f0;
      font-size: 22px; line-height: 1;
    }
    .viewer-close:hover { transform: none; background: rgba(48, 43, 52, .94); }
    .modal-bar {
      flex: 0 0 auto; padding: 8px 12px; display: flex; flex-wrap: wrap;
      gap: 8px; align-items: center; color: #ddd6e0;
      background: rgba(22, 18, 26, .58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .modal-bar span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #viewer-title { flex: 1 1 180px; }
    .viewer-index { flex: 0 0 auto; color: #9a909e; font-size: 12px; font-variant-numeric: tabular-nums; }
    .modal-bar button { background: #302b34; color: #eee8f0; padding: 8px 11px; }
    .modal-bar button:hover { transform: none; }
    .modal-bar button:focus-visible, .viewer-nav:focus-visible, .viewer-close:focus-visible {
      outline: 2px solid #ddb2c2; outline-offset: 2px;
    }
    .drop-mask {
      display: none; position: fixed; inset: 0; z-index: 30;
      place-items: center; pointer-events: none;
      background: rgba(251, 250, 252, .42);
    }
    body.file-drag .drop-mask { display: grid; }
    .drop-card {
      padding: 18px 28px; border: 1px dashed #d7a3b6; border-radius: 18px;
      background: rgba(255, 255, 255, .92); color: #8a5268;
      box-shadow: var(--shadow); font-size: 16px; font-weight: 650;
    }
    @media (max-width: 900px) {
      :root { --page-gutter: 12px; }
      .shell { padding-inline: 0; width: 100%; }
      header {
        padding: 10px var(--page-gutter) 4px;
        display: flex; align-items: baseline; gap: 8px;
      }
      .search-layout {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding-inline: 0;
        width: 100%;
      }
      .results-column { width: 100%; max-width: 100%; }
      .search-column { display: contents; }
      .search-panel {
        order: -3;
        position: static;
        z-index: auto;
        width: 100%;
        margin: 0;
        padding: 8px var(--page-gutter) 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: var(--paper);
        box-shadow: none;
        backdrop-filter: none;
      }

        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;

        padding: 0;

        border: 0;
        box-shadow: none;
      }
      #query { font-size: 16px; min-height: 44px; padding: 10px 12px; min-width: 0; }

      #search, .random-browse { min-height: 44px; padding: 10px 12px; box-shadow: none; }
      .composer { margin-top: 8px; }
      .tree-panel { order: -1; }
      .results-column { order: 0; }
      body.file-drag .search-panel {
        background: #fff8fb;
        outline: 2px dashed #d7a3b6;
        outline-offset: -4px;
        box-shadow: none;
      }
      .search-panel.loading { opacity: .55; pointer-events: none; }
      .fold-toggle { display: flex; }
      .fold-toggle {
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 8px var(--page-gutter);
        border: 0;
        border-block: 1px solid var(--line);
        border-radius: 0;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
        box-shadow: none;
      }
      .fold-toggle-meta {
        min-width: 0;
        margin-left: auto;

        color: var(--muted);
        font-size: 12px;
        font-weight: 500;

        text-overflow: ellipsis;
      }
      .fold-toggle-chevron { flex: 0 0 auto; color: var(--muted); }
      .tree-panel.is-open .fold-toggle-chevron { transform: rotate(180deg); }
      .tree-panel {
        position: relative;
        top: auto;
        z-index: auto;
        width: 100%;
        max-height: none;
        overflow: visible;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;

      .query-info {

  <script>
    const $ = (id) => document.getElementById(id);
    async function parseResponse(response) {
      const text = await response.text();
      let data = null;
      if (text) {
        try { data = JSON.parse(text); }
        catch { throw new Error(text.trim().slice(0, 180) || `HTTP ${response.status}`); }
      }
      if (!response.ok) {
        const detail = data && data.detail;
        const message = Array.isArray(detail)
          ? detail.map((item) => {
              const loc = Array.isArray(item.loc)
                ? item.loc.filter((part) => part !== 'body' && part !== 'query').join('.')
                : '';
              const msg = item.msg || JSON.stringify(item);

      }
      return data;
    }
    const MAX_REFS = 8;
    const state = {
      references: [], refSeq: 0, current: null, currentRefKey: null, viewerSource: 'gallery',
      results: [], offset: 0, hasMore: false, loadingMore: false, searchSeq: 0,
      colHeights: [],
      mode: 'idle', browseKey: '', browseName: '', browseTotal: 0,
      randomSeed: null, randomTotal: 0,
    };
    const VIEW_MIN_SCALE = 0.05;
    const VIEW_MAX_SCALE = 8;
    const view = {
      scale: 1, x: 0, y: 0, fitScale: 1,
      targetScale: 1, targetX: 0, targetY: 0,
      dragging: false, pinching: false, moved: false, animating: false, animToken: 0,
      pointerId: null, pointers: new Map(),
      px: 0, py: 0, startX: 0, startY: 0,
      vx: 0, vy: 0,
      pinchStartDist: 0, pinchStartScale: 1,
      clickTimer: 0,
      slideX: 0, slideTarget: 0, swiping: false, flipping: false, preserveSlide: false,
      lastTapAt: 0, lastTapX: 0, lastTapY: 0, suppressClick: 0,

      prev: $('viewer-image-prev'),
      current: $('viewer-image'),
      next: $('viewer-image-next'),

    const viewerPreload = new Map();
    const VIEWER_PRELOAD_LIMIT = 12;
    function prefersReducedMotion() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
    function isViewFitted() {
      const fit = view.fitScale || 1;
      return Math.abs(view.targetScale - fit) < 0.04 * Math.max(fit, 0.08);
    }
    function defaultViewLayoutScale(stageWidth, stageHeight, imageWidth, imageHeight) {
      if (!imageWidth || !imageHeight || stageWidth < 8 || stageHeight < 8) return 1;
      const contain = Math.min(stageWidth / imageWidth, stageHeight / imageHeight);
      const largerThanStage = imageWidth > stageWidth || imageHeight > stageHeight;
      if (largerThanStage) return contain;
      const landscape = stageWidth >= stageHeight;
      if (landscape && imageHeight < stageHeight / 2) return (stageHeight / 2) / imageHeight;
      if (!landscape && imageWidth < stageWidth / 2) return (stageWidth / 2) / imageWidth;
      return 1;
    }
    function imageBitmapFitScale(image) {
      const bitmapWidth = image.naturalWidth;
      const bitmapHeight = image.naturalHeight;
      if (!bitmapWidth || !bitmapHeight) return 1;
      const stage = $('viewer-stage');
      const stageWidth = stage.clientWidth || window.innerWidth;
      const stageHeight = stage.clientHeight || window.innerHeight;
      const shown = image.getAttribute('src') || '';
      const intended = image.dataset.src || '';
      const placeholder = Boolean(intended && shown && shown !== intended);
      const layoutWidth = (placeholder && Number(image.dataset.layoutWidth)) || bitmapWidth;
      const layoutHeight = (placeholder && Number(image.dataset.layoutHeight)) || bitmapHeight;
      const layoutScale = defaultViewLayoutScale(stageWidth, stageHeight, layoutWidth, layoutHeight);
      return layoutScale * (layoutWidth / bitmapWidth);
    }
    function computeContainScale(image = viewerSlots.current) {
      return imageBitmapFitScale(image);
    }
    function updateFitScale() {
      view.fitScale = computeContainScale();
      return view.fitScale;
    }
    const treeState = {
      roots: [],
      selected: new Set(),
      newKeys: new Set(),
      expanded: new Set(),
      sort: 'name',
      imageCount: 0,
      selectedImageCount: 0,
      saveTimer: null,
      mtimeAfter: '',
      mtimeBefore: '',
      mtimeMin: '',
      mtimeMax: '',

    const modelUi = { poll: null, applying: false, loaded: false };
    function modelHint(data) {
      if (data.loading) return '正在载入图文向量模型…';
      if (!data.loaded) return '启动时不占用显存；检索时自动载入。';
      if (!data.auto_unload_minutes) return '已载入 · 自动卸载已关闭，将保持占用显存。';
      const sec = data.idle_remaining_seconds;
      if (typeof sec === 'number') {
        if (sec >= 60) return `已载入 · 约 ${Math.ceil(sec / 60)} 分钟无检索后卸载`;
        if (sec > 0) return `已载入 · 约 ${Math.ceil(sec)} 秒后自动卸载`;
        return '已载入 · 即将自动卸载';
      }
      return `已载入 · ${data.auto_unload_minutes} 分钟无检索后卸载`;
    }
    function applyModelStatus(data) {
      modelUi.loaded = Boolean(data.loaded);
      modelUi.applying = true;
      const box = $('model-loaded');
      if (document.activeElement !== box) box.checked = Boolean(data.loaded);
      box.disabled = Boolean(data.loading);
      $('model-state').textContent = data.loading ? '载入中' : (data.loaded ? '已载入' : '未载入');

      const minutes = Number(data.auto_unload_minutes);
      if (Number.isFinite(minutes) && document.activeElement !== $('auto-unload')) {

      }
      modelUi.applying = false;
    }
    function modelApiErrorMessage(error) {
      const message = String(error && error.message || '');
      if (/not found/i.test(message) || message.includes('404')) {

    async function fetchModelStatus() {
      const data = await parseResponse(await fetch('/api/model'));
      applyModelStatus(data);

    }
    function startModelPoll() {
      const showError = (error) => { $('model-hint').textContent = modelApiErrorMessage(error); };
      fetchModelStatus().catch(showError);
      if (modelUi.poll) return;
      modelUi.poll = setInterval(() => { fetchModelStatus().catch(showError); }, 4000);
    }
    function stopModelPoll() {
      if (!modelUi.poll) return;
      clearInterval(modelUi.poll);
      modelUi.poll = null;
    }
    $('limit').addEventListener('input', () => $('limit-value').textContent = $('limit').value);
    $('model-loaded').addEventListener('change', async () => {
      if (modelUi.applying) return;
      const want = $('model-loaded').checked;
      $('model-loaded').disabled = true;
      $('model-state').textContent = want ? '载入中' : '卸载中';
      $('model-hint').textContent = want ? '正在载入图文向量模型…' : '正在卸载并释放显存…';
      try {
        const data = await parseResponse(await fetch('/api/model', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loaded: want }),
        }));
        applyModelStatus(data);
      } catch (error) {
        $('model-loaded').checked = !want;
        $('model-loaded').disabled = false;
        $('model-state').textContent = want ? '未载入' : '已载入';
        $('model-hint').textContent = `操作失败：${modelApiErrorMessage(error)}`;

      if (modelUi.applying) return;

      $('auto-unload').value = String(minutes);
      try {
        const data = await parseResponse(await fetch('/api/model', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ auto_unload_minutes: minutes }),
        }));
        applyModelStatus(data);
      } catch (error) {
        $('model-hint').textContent = `未能保存自动卸载时间：${modelApiErrorMessage(error)}`;
      }

    $('search-form').addEventListener('submit', (event) => { event.preventDefault(); runSearch(); });
    $('upload').addEventListener('change', (event) => {
      addReferenceFiles(event.target.files);

    $('ref-add').addEventListener('keydown', (event) => {

    $('viewer-close').addEventListener('click', () => $('viewer').close());

      if (!state.currentRefKey) return;

    $('viewer-zoom-out').addEventListener('click', () => zoomBy(1 / 1.25));

    function clampWeight(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 1;
      return Math.min(8, Math.max(0, Math.round(number * 10) / 10));
    }
    function textWeight() {
      return clampWeight($('text-weight').value);
    }
    function formatWeight(value) {
      return Number(value).toFixed(Number.isInteger(Number(value)) ? 0 : 1);
    }
    function isImageFile(file) {
      if (file.type && file.type.startsWith('image/')) return true;

    function isFileDrag(event) {

    function addReferenceFiles(fileList) {
      const files = [...fileList].filter(isImageFile);

      let added = 0;
      for (const file of files) {
        if (state.references.length >= MAX_REFS) break;
        const url = URL.createObjectURL(file);
        state.references.push({
          key: `r${++state.refSeq}`,
          id: null,
          file,
          name: file.name,
          src: url,
          preview: url,
          objectUrl: url,
          weight: 1,

      return added > 0;

    function addLibraryReference(item) {
      if (state.references.some((ref) => ref.id === item.id)) {

      if (state.references.length >= MAX_REFS) {
        $('query-info').textContent = `参考图最多 ${MAX_REFS} 张。`;
        return;

      state.references.push({
        key: `r${++state.refSeq}`,
        id: item.id,
        file: null,
        name: item.name,
        src: `/image/${item.id}`,
        preview: `/thumb/${item.id}`,

      const strip = $('ref-strip');

        const card = document.createElement('div');
        const selected = state.viewerSource === 'reference' && ref.key === state.currentRefKey;

    function newRandomSeed() {
      const values = new Uint32Array(2);
      crypto.getRandomValues(values);
      // Keep the seed below Number.MAX_SAFE_INTEGER so pagination sends the
      // exact same value back to the server after JSON round trips.
      return (values[0] & 0x1fffff) * 0x100000000 + values[1];

    function galleryColumnCount() {

    function estimateCardHeight(item, columnWidth) {
      const ratio = item.width > 0 && item.height > 0 ? item.height / item.width : 1.25;
      const hits = item.tag_hits && item.tag_hits.length ? 22 : 0;
      return columnWidth * ratio + 108 + hits;
    }
    function shortestColumnIndex() {

        if (state.colHeights[index] < state.colHeights[best]) best = index;
      }
      return best;

    function ensureGalleryColumns() {

      if (gallery.dataset.cols === String(count) && gallery.querySelector('.gallery-col')) return;
      gallery.replaceChildren();
      for (let index = 0; index < count; index += 1) {
        const column = document.createElement('div');
        column.className = 'gallery-col';
        gallery.appendChild(column);
      }
      gallery.dataset.cols = String(count);
      state.colHeights = Array(count).fill(0);

      const index = shortestColumnIndex();
      cols[index].appendChild(element);
      const width = cols[index].clientWidth || (($('gallery').clientWidth - 14 * (cols.length - 1)) / cols.length);
      state.colHeights[index] += estimateCardHeight(item, width);
    }

          <div class="card-body">
            <div class="filename" title="${escapeHtml(item.path)}">${escapeHtml(item.name)}</div>
            <div class="meta">${item.width} × ${item.height}</div>
            ${item.tag_hits && item.tag_hits.length ? `<div class="hits">命中：${item.tag_hits.map(t => escapeHtml(t.replaceAll('_',' '))).join(' · ')}</div>` : ''}

    function renderGallery(results, { append } = { append: false }) {

          : state.mode === 'random'

    function bindGalleryCards() {

    }
    function updateViewerNav() {

    }

        image.style.visibility = 'hidden';
        return;
      }
      const fit = imageBitmapFitScale(image);
      const scale = live ? view.scale : fit;
      const x = live ? view.x : 0;
      const y = live ? view.y : 0;
      const tx = x + view.slideX + slotX - (nw * scale) / 2;
      const ty = y - (nh * scale) / 2;
      image.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

        input.addEventListener('change', () => {
          const current = findNode(treeState.roots, input.dataset.key);
          if (!current) return;
          setFolderSelection(descendantKeys(current), nodeCheckState(current) !== 'all');
        });
      });
    }
    function renderTreeNode(node, depth) {
      const hasChildren = node.children.length > 0;
      const expanded = treeState.expanded.has(node.key);
      const check = nodeCheckState(node);
      const isNew = treeState.newKeys.has(node.key);
      const isPreview = state.browseKey === node.key;
      const children = hasChildren && expanded
        ? node.children.map((child) => renderTreeNode(child, depth + 1)).join('')
        : '';
      return `
        <div class="tree-row${isPreview ? ' is-preview' : ''}" style="padding-left:${8 + depth * 14}px">
          <button class="tree-twist" type="button" data-tree-action="twist" data-key="${escapeHtml(node.key)}" ${hasChildren ? '' : 'hidden'} aria-label="展开或折叠" aria-expanded="${expanded}">${expanded ? '▾' : '▸'}</button>
          <label class="tree-check" title="纳入查询范围">
            <input type="checkbox" data-key="${escapeHtml(node.key)}" ${check === 'all' ? 'checked' : ''} aria-label="将 ${escapeHtml(node.name)} 纳入查询范围">
          </label>
          <button class="tree-name" type="button" data-tree-action="preview" data-key="${escapeHtml(node.key)}" data-name="${escapeHtml(node.name)}" title="在右侧预览「${escapeHtml(node.name)}」" aria-pressed="${isPreview}">${escapeHtml(node.name)}</button>
          ${isNew ? '<span class="tree-new">新</span>' : ''}
          <span class="tree-count" data-tree-action="preview" data-key="${escapeHtml(node.key)}" data-name="${escapeHtml(node.name)}" title="在右侧预览">${node.total}</span>
          ${depth === 0 ? `<button class="tree-refresh" type="button" data-tree-action="refresh" data-key="${escapeHtml(node.key)}" data-path="${escapeHtml(node.path)}" data-name="${escapeHtml(node.name)}" title="增量更新该索引目录">↻</button>` : ''}
          <button class="tree-remove" type="button" data-tree-action="remove" data-key="${escapeHtml(node.key)}" data-name="${escapeHtml(node.name)}" title="从索引中移出，不删除原图">×</button>
        </div>
        ${children}`;
    }
    function findNode(nodes, key) {
      for (const node of nodes) {
        if (node.key === key) return node;
        const nested = findNode(node.children, key);
        if (nested) return nested;
      }
      return null;
    }
    let indexPoll = null;
    function showIndexStatus(text, show = true) {
      const box = $('index-status');
      box.hidden = !show;
      box.textContent = text || '';
    }
    async function startIndexJob({ path, paths, label }) {
      const payload = { recursive: true };
      if (paths && paths.length) payload.paths = paths;
      else payload.path = path;
      showIndexStatus(label ? `正在更新「${label}」…` : '正在开始索引…');
      try {
        const response = await fetch('/api/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await parseResponse(response);
        showIndexStatus(data.message || '正在索引…');
        pollIndexStatus();
      } catch (error) {
        showIndexStatus(`索引失败：${error.message}`);
      }
    }
    async function addIndexDirectory() {
      const path = $('index-path').value.trim();
      if (!path) { showIndexStatus('请先粘贴要加入索引的本地目录路径。'); return; }
      await startIndexJob({ path, label: path });
    }
    async function refreshAllIndexed() {
      const paths = treeState.roots.map((node) => node.path).filter(Boolean);
      if (!paths.length) { showIndexStatus('没有可更新的索引目录。'); return; }
      await startIndexJob({ paths, label: `${paths.length} 个索引目录` });
    }
    async function pollIndexStatus() {
      if (indexPoll) return;
      const tick = async () => {
        try {
          const response = await fetch('/api/index-status');
          const data = await parseResponse(response);
          if (data.running) {
            showIndexStatus(data.message || '正在索引…');
            return true;
          }
          if (data.error) {
            showIndexStatus(`索引失败：${data.error}`);
            return false;
          }
          const summary = data.summary;
          showIndexStatus(
            summary
              ? `${data.message}：发现 ${summary.discovered}，更新 ${summary.indexed}，未变 ${summary.unchanged}`
              : (data.message || '索引完成')
          );
          await loadLibraryTree();
          return false;
        } catch (error) {
          showIndexStatus(`无法读取索引进度：${error.message}`);
          return false;
        }
      };
      if (await tick()) {
        indexPoll = setInterval(async () => {
          if (!(await tick())) {
            clearInterval(indexPoll);
            indexPoll = null;
          }
        }, 800);
      }
    }
    async function removeIndexedFolder(key, name) {
      if (!confirm(`把「${name}」从索引中移出？原图不会删除。`)) return;
      showIndexStatus('正在移出索引…');
      try {
        const response = await fetch('/api/index-remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ folder_key: key }),
        });
        const data = await parseResponse(response);
        applyLibraryPayload(data, { keepExpanded: true });
        if (state.browseKey === key || (state.browseKey && !findNode(treeState.roots, state.browseKey))) {
          state.mode = 'idle';
          state.browseKey = '';
          state.browseName = '';
          state.browseTotal = 0;
          state.results = [];
          state.hasMore = false;
          $('gallery').replaceChildren();
          $('query-info').textContent = `已移出「${name}」。点击其他目录名可继续预览。`;
          renderTree();
        }
        showIndexStatus(`已移出「${name}」，原图仍在磁盘上。`);
      } catch (error) {
        showIndexStatus(`移出失败：${error.message}`);
      }
    }
    async function loadLibraryTree() {
      try {
        const response = await fetch('/api/library-tree');
        const data = await parseResponse(response);
        applyLibraryPayload(data);
      } catch (error) {
        $('tree-summary').textContent = `目录树不可用：${error.message}`;
      }
    }
    async function saveLibraryTree() {
      try {
        const response = await fetch('/api/library-tree', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sort: treeState.sort || 'name',
            selected: [...treeState.selected].filter((key) => typeof key === 'string' && key),
            mtime_after: treeState.mtimeAfter || null,
            mtime_before: treeState.mtimeBefore || null,
          }),
        });
        const data = await parseResponse(response);
        applyLibraryPayload(data, { keepExpanded: true });
      } catch (error) {
        $('tree-summary').textContent = `目录选择未能保存：${error.message}`;
      }
    }

    function localISO(day) {
      const year = day.getFullYear();
      const month = String(day.getMonth() + 1).padStart(2, '0');
      const date = String(day.getDate()).padStart(2, '0');
      return `${year}-${month}-${date}`;
    }
    function daysAgoISO(days) {
      const day = new Date();
      day.setHours(0, 0, 0, 0);
      day.setDate(day.getDate() - days);
      return localISO(day);
    }
    function currentTimeRange() {
      return { after: treeState.mtimeAfter || '', before: treeState.mtimeBefore || '' };
    }
    function inferTimePreset(after, before) {
      if (!after && !before) return 'all';
      const today = localISO(new Date());
      if (before && before !== today) return 'custom';
      const presets = ['7', '30', '90', '365'];
      for (const days of presets) {
        if (after === daysAgoISO(Number(days))) return days;
      }
      return 'custom';
    }
    function applyTimePreset(preset) {
      if (preset === 'all') {
        treeState.mtimeAfter = '';
        treeState.mtimeBefore = '';
      } else if (preset !== 'custom') {
        treeState.mtimeAfter = daysAgoISO(Number(preset));
        treeState.mtimeBefore = localISO(new Date());
      }
      syncTimeInputs();
      updateTreeSummary();
      scheduleTreeSave();
    }
    function syncTimeInputs() {
      const after = $('mtime-after');
      const before = $('mtime-before');
      after.min = treeState.mtimeMin || '';
      after.max = treeState.mtimeMax || '';
      before.min = treeState.mtimeMin || '';
      before.max = treeState.mtimeMax || '';
      after.value = treeState.mtimeAfter || '';
      before.value = treeState.mtimeBefore || '';
      const preset = inferTimePreset(treeState.mtimeAfter, treeState.mtimeBefore);
      $('time-preset').value = preset;
      $('time-custom').classList.toggle('visible', preset === 'custom');
    }

    $('index-add').addEventListener('click', addIndexDirectory);
    $('index-refresh-all').addEventListener('click', refreshAllIndexed);
    $('random-browse').addEventListener('click', startRandomBrowse);
    $('index-path').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); addIndexDirectory(); }
    });
    $('tree-select-all').addEventListener('click', () => setFolderSelection(allFolderKeys(), true));
    $('tree-select-none').addEventListener('click', () => setFolderSelection(allFolderKeys(), false));
    $('tree-sort').addEventListener('change', () => {
      treeState.sort = $('tree-sort').value;
      renderTree();
      saveLibraryTree();
      if (state.mode === 'browse' && state.browseKey) fetchFolderImages({ reset: true });
    });
    const loadMore = $('load-more');
    const scrollObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) loadMoreResults();
    }, { root: null, rootMargin: '720px 0px', threshold: 0 });
    scrollObserver.observe(loadMore);
    let galleryResizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(galleryResizeTimer);
      galleryResizeTimer = setTimeout(() => {
        const gallery = $('gallery');
        if (!gallery || !state.results.length) return;
        if (gallery.dataset.cols === String(galleryColumnCount())) return;
        renderGallery(state.results, { append: false });
      }, 120);
    });

    $('time-preset').addEventListener('change', () => applyTimePreset($('time-preset').value));
    $('mtime-after').addEventListener('change', () => {
      treeState.mtimeAfter = $('mtime-after').value;
      $('time-preset').value = 'custom';
      $('time-custom').classList.add('visible');
      updateTreeSummary();
      scheduleTreeSave();
    });
    $('mtime-before').addEventListener('change', () => {
      treeState.mtimeBefore = $('mtime-before').value;
      $('time-preset').value = 'custom';
      $('time-custom').classList.add('visible');
      updateTreeSummary();
      scheduleTreeSave();
    });

    let fileDragClear = 0;
    document.addEventListener('dragover', (event) => {
      if (!isFileDrag(event)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      document.body.classList.add('file-drag');
      clearTimeout(fileDragClear);
      fileDragClear = setTimeout(() => document.body.classList.remove('file-drag'), 140);
    });
    document.addEventListener('drop', (event) => {
      if (!isFileDrag(event)) return;
      event.preventDefault();
      clearTimeout(fileDragClear);
      document.body.classList.remove('file-drag');
      addReferenceFiles(event.dataTransfer.files);
    });
    document.addEventListener('dragend', () => document.body.classList.remove('file-drag'));
    document.addEventListener('keydown', (event) => {
      if (!$('viewer').open) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); stepViewer(-1, { animate: true }); }
      else if (event.key === 'ArrowRight') { event.preventDefault(); stepViewer(1, { animate: true }); }
      else if (event.key === '+' || event.key === '=') { event.preventDefault(); zoomBy(1.25); }
      else if (event.key === '-' || event.key === '_') { event.preventDefault(); zoomBy(1 / 1.25); }
      else if (event.key === '0') { event.preventDefault(); resetView(false); }
    });
    document.addEventListener('wheel', (event) => {
      if ($('viewer').open && event.ctrlKey) event.preventDefault();
    }, { passive: false });
    function setSideTab(name) {
      const scope = name === 'scope';
      $('tab-scope').hidden = !scope;
      $('tab-advanced').hidden = scope;
      $('tab-btn-scope').classList.toggle('is-active', scope);
      $('tab-btn-advanced').classList.toggle('is-active', !scope);
      $('tab-btn-scope').setAttribute('aria-selected', String(scope));
      $('tab-btn-advanced').setAttribute('aria-selected', String(!scope));
      if (scope) stopModelPoll();
      else startModelPoll();
    }
    $('tab-btn-scope').addEventListener('click', () => setSideTab('scope'));
    $('tab-btn-advanced').addEventListener('click', () => setSideTab('advanced'));
    $('scope-toggle').addEventListener('click', () => {
      const panel = $('tree-panel');
      const open = !panel.classList.contains('is-open');
      panel.classList.toggle('is-open', open);
      $('scope-toggle').setAttribute('aria-expanded', String(open));
    });
    $('text-weight').addEventListener('change', () => {
      $('text-weight').value = String(textWeight());
    });
    if (window.matchMedia('(pointer: fine)').matches) $('query').focus();
    loadLibraryTree();
    fetchModelStatus().catch((error) => {
      $('model-hint').textContent = modelApiErrorMessage(error);
    });
  </script>
</body>
</html>
