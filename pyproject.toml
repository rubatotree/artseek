[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artseek-local"
version = "0.1.0"
description = "Offline-first semantic image search for illustration collections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArtSeek contributors" }]
keywords = [
  "image-search",
  "illustration",
  "siglip",
  "danbooru",
  "local-first",
  "offline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = [
  "huggingface-hub>=0.28,<2",
  "httpx[socks]>=0.28,<1",
  "numpy>=1.26,<3",
  "pillow>=10.4,<13",
  "platformdirs>=4.3,<5",
  "protobuf>=5,<8",
  "qdrant-client>=1.13,<2",
  "rich>=13.9,<15",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",  # Windows PyPI wheels are CPU-only; run scripts/install_cuda_torch.ps1
  "transformers>=4.49,<6",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
tagger = ["timm>=1.0.15,<2"]
web = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
all = [
  "timm>=1.0.15,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
artseek = "artseek.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/artseek"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/artseek/web/app.py" = ["B008"]
